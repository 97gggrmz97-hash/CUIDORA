name: Maps tests
on:
  push:
    paths:
      - 'modules/maps/**'
      - 'mapa-es*'
      - '.github/workflows/maps-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test modules/maps/*.test.mjs
      - run: node --check mapa-es.mjs
